name: Test Tencent Docs Structure

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP client
        run: |
          npm init -y
          npm install @modelcontextprotocol/client

      - name: Inspect Tencent Docs
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}
        run: |
          cat > test.mjs <<'EOF'
          import {
            Client,
            StreamableHTTPClientTransport
          } from "@modelcontextprotocol/client";

          const client = new Client({
            name: "business-scene-progress",
            version: "1.0.0"
          });

          const transport = new StreamableHTTPClientTransport(
            new URL("https://docs.qq.com/openapi/mcp"),
            {
              requestInit: {
                headers: {
                  Authorization: process.env.TENCENT_DOCS_TOKEN
                }
              }
            }
          );

          await client.connect(transport);

          // 1. 查看实际可用工具
          const toolList = await client.listTools();

          const relatedTools = toolList.tools
            .map(t => t.name)
            .filter(name =>
              /sheet|excel|range|table|record/i.test(name)
            );

          console.log("===== Sheet-related tools =====");
          relatedTools.forEach(x => console.log(x));

          // 2. 读取腾讯文档
          const result = await client.callTool({
            name: "get_content",
            arguments: {
              file_id: "DWGtwaVhPcVVlVGRW"
            }
          });

          if (result.isError) {
            throw new Error("get_content returned an error");
          }

          let raw = (result.content || [])
            .filter(x => x.type === "text")
            .map(x => x.text || "")
            .join("\n");

          // 尝试解析 JSON 包装
          function longestString(value) {
            let best = "";

            function walk(v) {
              if (typeof v === "string") {
                if (v.length > best.length) best = v;
              } else if (Array.isArray(v)) {
                v.forEach(walk);
              } else if (v && typeof v === "object") {
                Object.values(v).forEach(walk);
              }
            }

            walk(value);
            return best;
          }

          try {
            const parsed = JSON.parse(raw);
            const candidate = longestString(parsed);
            if (candidate.length > raw.length * 0.3) {
              raw = candidate;
            }
          } catch {}

          // 解开字符串中的转义换行/制表符
          let text = raw
            .replace(/\\r\\n/g, "\n")
            .replace(/\\n/g, "\n")
            .replace(/\\t/g, "\t");

          const lines = text
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean);

          const pipeLines = lines.filter(x => x.includes("|"));
          const tabLines = lines.filter(x => x.includes("\t"));

          console.log("===== Decoded structure =====");
          console.log("Characters:", text.length);
          console.log("Non-empty lines:", lines.length);
          console.log("Pipe lines:", pipeLines.length);
          console.log("Tab lines:", tabLines.length);

          console.log("===== Keyword check =====");

          const keywords = [
            "一级目录",
            "二级目录",
            "三级目录",
            "业务场景",
            "批次",
            "费用薪酬",
            "应付结算",
            "应收收入",
            "资产",
            "税务",
            "总账",
            "设计",
            "电商"
          ];

          for (const k of keywords) {
            console.log(k + ":", text.includes(k) ? "YES" : "NO");
          }

          // 只打印表头候选，不打印业务明细
          const headers = lines.filter(line =>
            line.includes("业务场景") ||
            line.includes("一级目录") ||
            line.includes("二级目录") ||
            line.includes("三级目录")
          );

          console.log("===== Header candidates =====");
          console.log("Count:", headers.length);

          headers.slice(0, 10).forEach((x, i) => {
            console.log(`Header ${i + 1}:`, x.slice(0, 500));
          });

          await client.close();
          EOF

          node test.mjs
