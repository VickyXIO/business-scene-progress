name: Test Tencent Docs MCP

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP client
        run: |
          npm init -y
          npm install @modelcontextprotocol/client

      - name: Check Tencent Docs structure
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}
        run: |
          cat > test.mjs <<'EOF'
          import {
            Client,
            StreamableHTTPClientTransport
          } from "@modelcontextprotocol/client";

          const token = process.env.TENCENT_DOCS_TOKEN;

          const client = new Client({
            name: "business-scene-progress",
            version: "1.0.0"
          });

          const transport = new StreamableHTTPClientTransport(
            new URL("https://docs.qq.com/openapi/mcp"),
            {
              requestInit: {
                headers: {
                  Authorization: token
                }
              }
            }
          );

          await client.connect(transport);

          const result = await client.callTool({
            name: "get_content",
            arguments: {
              file_id: "DWGtwaVhPcVVlVGRW"
            }
          });

          if (result.isError) {
            throw new Error("get_content returned an error");
          }

          const texts = (result.content || [])
            .filter(item => item.type === "text")
            .map(item => item.text || "");

          const fullText = texts.join("\n");
          const lines = fullText
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean);

          console.log("Tencent Docs connected successfully.");
          console.log("Total characters:", fullText.length);
          console.log("Total non-empty lines:", lines.length);
          console.log("Pipe-style lines:", lines.filter(x => x.includes("|")).length);
          console.log("Tab-style lines:", lines.filter(x => x.includes("\t")).length);

          const keywords = [
            "一级目录",
            "二级目录",
            "三级目录",
            "业务场景",
            "批次",
            "费用薪酬",
            "应付结算",
            "应收收入",
            "资产",
            "税务",
            "总账",
            "设计",
            "电商"
          ];

          console.log("===== Keyword check =====");

          for (const keyword of keywords) {
            console.log(
              keyword + ":",
              fullText.includes(keyword) ? "YES" : "NO"
            );
          }

          const headerCandidates = lines.filter(line =>
            line.includes("一级目录") ||
            line.includes("二级目录") ||
            line.includes("三级目录") ||
            line.includes("业务场景")
          );

          console.log("Header candidate count:", headerCandidates.length);

          headerCandidates.slice(0, 10).forEach((line, index) => {
            console.log(`Header ${index + 1}:`, line);
          });

          await client.close();
          EOF

          node test.mjs
