name: Sync Tencent Docs Details

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-tencent-details
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install @modelcontextprotocol/client csv-parse >/dev/null 2>&1

      - name: Read Tencent Docs sheets and build details.json
        env:
          TENCENT_DOCS_TOKEN: ${{ secrets.TENCENT_DOCS_TOKEN }}
        run: |
          cat > sync.mjs <<'EOF'
          import fs from "node:fs";
          import { parse as parseCsv } from "csv-parse/sync";
          import {
            Client,
            StreamableHTTPClientTransport
          } from "@modelcontextprotocol/client";

          const FILE_ID = "DWGtwaVhPcVVlVGRW";
          const SOURCE_URL = "https://docs.qq.com/sheet/DWGtwaVhPcVVlVGRW?tab=BB08J2";
          const TARGET_SHEETS = ["通用", "设计行业", "电商行业", "地产行业", "物业行业"];
          const EXPECTED_GROUPS = [
            "费用薪酬组",
            "应付结算组",
            "应收收入组",
            "资产组",
            "税务核算组",
            "总账报表档案组",
            "设计组",
            "电商组",
            "地产组",
            "物业组"
          ];

          const token = process.env.TENCENT_DOCS_TOKEN;
          if (!token) throw new Error("TENCENT_DOCS_TOKEN is missing");

          function clean(v) {
            return String(v ?? "")
              .replace(/\r\n/g, "\n")
              .replace(/\r/g, "\n")
              .trim();
          }

          function normalizeGroup(v, sheetName = "") {
            const s = clean(v).replace(/\s+/g, "");
            const sheet = clean(sheetName).replace(/\s+/g, "");

            if (sheet.includes("设计") || s.includes("设计")) return "设计组";
            if (sheet.includes("电商") || /电商|电商集成/.test(s)) return "电商组";
            if (sheet.includes("地产") || s.includes("地产")) return "地产组";
            if (sheet.includes("物业") || s.includes("物业")) return "物业组";
            if (/费用|薪酬/.test(s)) return "费用薪酬组";
            if (/应付/.test(s)) return "应付结算组";
            if (/应收/.test(s)) return "应收收入组";
            if (/资产/.test(s)) return "资产组";
            if (/税务|税收|税金/.test(s)) return "税务核算组";
            if (/总账|报表|档案/.test(s)) return "总账报表档案组";
            return "";
          }

          function classifyBatchHeader(v) {
            const s = clean(v).replace(/\s+/g, "");
            if (!s) return "";
            if (/提前批/.test(s)) return "提前批";
            if (/9月23日|9\/23/.test(s)) return "第一批";
            if (/9月28日|9\/28/.test(s)) return "第二批";
            if (/10月15日|10\/15/.test(s)) return "第三批";
            return "";
          }

          function isMarked(v) {
            const s = clean(v).replace(/\s+/g, "");
            return /[✔√✓☑✅]/.test(s) || /^(是|yes|y|1)$/i.test(s);
          }

          function textBlocks(result) {
            return (result?.content || [])
              .filter(x => x?.type === "text")
              .map(x => x.text || "");
          }

          function parseMaybeJson(text) {
            if (typeof text !== "string") return text;
            let current = text.trim();
            for (let i = 0; i < 3; i++) {
              try {
                const parsed = JSON.parse(current);
                if (typeof parsed === "string") {
                  current = parsed.trim();
                  continue;
                }
                return parsed;
              } catch {
                return text;
              }
            }
            return current;
          }

          function extractPayload(result) {
            const blocks = textBlocks(result);
            if (!blocks.length) return result;

            // Most Tencent Docs MCP tools return JSON inside one text block.
            for (const block of blocks) {
              const parsed = parseMaybeJson(block);
              if (parsed && typeof parsed === "object") return parsed;
            }

            return blocks.join("\n");
          }

          function walkObjects(value, out = []) {
            if (Array.isArray(value)) {
              for (const item of value) walkObjects(item, out);
            } else if (value && typeof value === "object") {
              out.push(value);
              for (const item of Object.values(value)) walkObjects(item, out);
            }
            return out;
          }

          function pick(obj, names) {
            for (const name of names) {
              if (obj && Object.prototype.hasOwnProperty.call(obj, name)) return obj[name];
            }
            return undefined;
          }

          function extractSheetList(result) {
            const payload = extractPayload(result);
            const objects = walkObjects(payload);
            const sheets = [];
            const seen = new Set();

            for (const obj of objects) {
              const id = pick(obj, ["sheet_id", "sheetId", "id", "subsheet_id", "subSheetId"]);
              const name = pick(obj, ["sheet_name", "sheetName", "name", "title"]);
              if (typeof id !== "string" || typeof name !== "string") continue;

              const key = `${id}::${name}`;
              if (seen.has(key)) continue;

              const rows = Number(pick(obj, [
                "used_end_row", "usedEndRow", "used_range_end_row", "usedRangeEndRow",
                "row_count", "rowCount", "rows", "max_row", "maxRow"
              ]));
              const cols = Number(pick(obj, [
                "used_end_col", "usedEndCol", "used_range_end_col", "usedRangeEndCol",
                "column_count", "columnCount", "col_count", "colCount", "cols", "max_col", "maxCol"
              ]));

              sheets.push({
                id,
                name: clean(name),
                rows: Number.isFinite(rows) && rows > 0 ? rows : null,
                cols: Number.isFinite(cols) && cols > 0 ? cols : null
              });
              seen.add(key);
            }

            return sheets;
          }

          function findCsvData(value) {
            if (typeof value === "string") {
              if (value.includes(",") || value.includes("\n")) return value;
              return "";
            }
            if (Array.isArray(value)) {
              for (const item of value) {
                const found = findCsvData(item);
                if (found) return found;
              }
              return "";
            }
            if (value && typeof value === "object") {
              for (const key of ["csv_data", "csvData", "csv", "data"]) {
                if (typeof value[key] === "string" && value[key].length > 5) return value[key];
              }
              for (const item of Object.values(value)) {
                const found = findCsvData(item);
                if (found) return found;
              }
            }
            return "";
          }

          function extractCsv(result) {
            const payload = extractPayload(result);
            let csv = findCsvData(payload);

            if (!csv) {
              const blocks = textBlocks(result);
              csv = blocks.sort((a, b) => b.length - a.length)[0] || "";
            }

            // Some MCP responses wrap escaped CSV inside a JSON string.
            const parsed = parseMaybeJson(csv);
            if (typeof parsed === "string") csv = parsed;

            return csv
              .replace(/\\r\\n/g, "\n")
              .replace(/\\n/g, "\n")
              .replace(/\\t/g, "\t");
          }

          function parseRows(csvText) {
            if (!csvText || csvText.length < 5) return [];
            return parseCsv(csvText, {
              relax_column_count: true,
              relax_quotes: true,
              skip_empty_lines: false
            }).map(row => row.map(clean));
          }

          function locateHeader(rows) {
            for (let r = 0; r < Math.min(rows.length, 20); r++) {
              const row = rows[r];
              const scene = row.findIndex(v => clean(v).includes("业务场景"));
              const group = row.findIndex(v => clean(v).includes("共享组别"));
              if (scene >= 0 && group >= 0) {
                const find = keyword => row.findIndex(v => clean(v).includes(keyword));
                return {
                  rowIndex: r,
                  serial: find("序号"),
                  group,
                  level1: find("一级服务目录"),
                  level2: find("二级服务目录"),
                  level3: find("三级服务目录"),
                  shared: find("是否纳入共享"),
                  scene,
                  batchStart: find("报送初稿")
                };
              }
            }
            return null;
          }

          function parseSheetRecords(sheetName, rows) {
            const header = locateHeader(rows);
            if (!header) {
              throw new Error(`Cannot locate header row in sheet: ${sheetName}`);
            }

            const batchHeaderRow = rows[header.rowIndex + 1] || [];
            const batchColumns = [];

            for (let c = 0; c < batchHeaderRow.length; c++) {
              const batch = classifyBatchHeader(batchHeaderRow[c]);
              if (batch) batchColumns.push({ col: c, batch });
            }

            // Fallback: if the second header row was not returned cleanly, use the
            // known batch area starting at “报送初稿”.
            if (!batchColumns.length && header.batchStart >= 0) {
              const fallback = sheetName === "通用"
                ? ["提前批", "第一批", "第二批", "第三批"]
                : sheetName === "设计行业"
                  ? ["第二批", "第三批"]
                  : sheetName === "地产行业"
                    ? ["第二批"]
                    : sheetName === "物业行业"
                      ? ["第三批"]
                      : ["第一批", "第二批", "第三批"];
              fallback.forEach((batch, i) => batchColumns.push({ col: header.batchStart + i, batch }));
            }

            const ctx = {
              group: normalizeGroup("", sheetName),
              level1: "",
              level2: "",
              level3: "",
              shared: ""
            };

            const records = [];
            let localSerial = 0;

            for (let r = header.rowIndex + 2; r < rows.length; r++) {
              const row = rows[r] || [];
              const rawScene = header.scene >= 0 ? clean(row[header.scene]) : "";

              // Ignore fully blank lines.
              if (!row.some(v => clean(v))) continue;

              const rawGroup = header.group >= 0 ? clean(row[header.group]) : "";
              const normalizedGroup = normalizeGroup(rawGroup, sheetName);
              if (normalizedGroup) ctx.group = normalizedGroup;

              const forwardFill = (key, col) => {
                if (col < 0) return ctx[key];
                const val = clean(row[col]);
                if (val) ctx[key] = val;
                return ctx[key];
              };

              const level1 = forwardFill("level1", header.level1);
              const level2 = forwardFill("level2", header.level2);
              const level3 = forwardFill("level3", header.level3);
              const shared = forwardFill("shared", header.shared);

              if (!ctx.group || !rawScene || rawScene === "业务场景") continue;
              if (rawScene.includes("场景没列全")) continue;

              let batch = "待定";
              for (const { col, batch: batchName } of batchColumns) {
                if (isMarked(row[col])) {
                  batch = batchName;
                  break;
                }
              }

              localSerial += 1;
              const sourceSerial = header.serial >= 0 ? clean(row[header.serial]) : "";

              records.push({
                id: `${sheetName}-${ctx.group}-${localSerial}`,
                group: ctx.group,
                serial: sourceSerial || String(localSerial),
                level1,
                level2,
                level3,
                shared,
                scene: rawScene,
                batch,
                sheet: sheetName
              });
            }

            return records;
          }

          function groupCounts(records) {
            const counts = {};
            for (const r of records) counts[r.group] = (counts[r.group] || 0) + 1;
            return counts;
          }

          function validateAgainstExisting(newRecords) {
            const foundGroups = [...new Set(newRecords.map(r => r.group))];
            const missing = EXPECTED_GROUPS.filter(g => !foundGroups.includes(g));
            if (missing.length) {
              throw new Error(`Safety stop: missing groups: ${missing.join(", ")}`);
            }

            if (newRecords.length < 500) {
              throw new Error(`Safety stop: only ${newRecords.length} records were parsed.`);
            }

            if (!fs.existsSync("details.json")) return;

            try {
              const old = JSON.parse(fs.readFileSync("details.json", "utf8"));
              const oldRecords = Array.isArray(old?.records) ? old.records : [];
              if (!oldRecords.length) return;

              // Prevent a parser/API regression from wiping most of the current data.
              if (newRecords.length < oldRecords.length * 0.7) {
                throw new Error(
                  `Safety stop: parsed ${newRecords.length} records, below 70% of current ${oldRecords.length}.`
                );
              }

              const oldCounts = groupCounts(oldRecords);
              const newCounts = groupCounts(newRecords);
              for (const group of EXPECTED_GROUPS) {
                const before = oldCounts[group] || 0;
                const after = newCounts[group] || 0;
                if (before >= 10 && after < before * 0.5) {
                  throw new Error(
                    `Safety stop: ${group} dropped from ${before} to ${after} records.`
                  );
                }
              }
            } catch (err) {
              if (String(err?.message || err).startsWith("Safety stop:")) throw err;
              console.log("Existing details.json validation skipped:", err?.message || err);
            }
          }

          const client = new Client({
            name: "business-scene-progress-sync",
            version: "2.0.0"
          });

          const transport = new StreamableHTTPClientTransport(
            new URL("https://docs.qq.com/openapi/mcp"),
            { requestInit: { headers: { Authorization: token } } }
          );

          await client.connect(transport);

          // 1) Get all sheet IDs and used sizes.
          const sheetInfoResult = await client.callTool({
            name: "sheet.get_sheet_info",
            arguments: { file_id: FILE_ID }
          });
          if (sheetInfoResult.isError) throw new Error("sheet.get_sheet_info returned an error");

          const sheets = extractSheetList(sheetInfoResult);
          console.log("Sheets discovered:", sheets.map(s => `${s.name}(${s.id})`).join(", "));

          const selected = TARGET_SHEETS.map(name => {
            const exact = sheets.find(s => s.name === name);
            if (exact) return exact;
            const fuzzy = sheets.find(s => s.name.replace(/\s+/g, "").includes(name.replace(/\s+/g, "")));
            if (fuzzy) return fuzzy;
            throw new Error(`Safety stop: target sheet not found: ${name}`);
          });

          // 2) Read each target sheet as CSV.
          // Tencent Docs currently returns only the first row when the optional range
          // arguments are omitted, so request a deliberately generous range.
          // The current workbook is well below these limits; blank trailing cells/rows
          // are harmless because the parser ignores empty records.
          const READ_END_ROW = 3000;
          const READ_END_COL = 50;

          const allRecords = [];
          for (const sheet of selected) {
            const args = {
              file_id: FILE_ID,
              sheet_id: sheet.id,
              start_row: 0,
              end_row: READ_END_ROW,
              start_col: 0,
              end_col: READ_END_COL,
              return_csv: true
            };

            const cellResult = await client.callTool({
              name: "sheet.get_cell_data",
              arguments: args
            });
            if (cellResult.isError) throw new Error(`sheet.get_cell_data returned an error for ${sheet.name}`);

            const csv = extractCsv(cellResult);
            const rows = parseRows(csv);
            console.log(`${sheet.name}: ${rows.length} rows read`);

            const records = parseSheetRecords(sheet.name, rows);
            console.log(`${sheet.name}: ${records.length} records parsed`);
            allRecords.push(...records);
          }

          const counts = groupCounts(allRecords);
          console.log("Total parsed records:", allRecords.length);
          console.log("Group counts:", JSON.stringify(counts));

          validateAgainstExisting(allRecords);

          // Do not touch details.json when the business records are unchanged.
          // This prevents a new Git commit every five minutes just because generatedAt changed.
          let existingRecords = null;
          if (fs.existsSync("details.json")) {
            try {
              const existing = JSON.parse(fs.readFileSync("details.json", "utf8"));
              if (Array.isArray(existing?.records)) existingRecords = existing.records;
            } catch {}
          }

          const unchanged = existingRecords &&
            JSON.stringify(existingRecords) === JSON.stringify(allRecords);

          if (unchanged) {
            console.log("Tencent Docs records are unchanged; details.json will not be rewritten.");
          } else {
            const output = {
              generatedAt: new Date().toISOString(),
              source: {
                name: "腾讯文档业务场景明细",
                type: "tencent-docs",
                fileId: FILE_ID,
                url: SOURCE_URL
              },
              records: allRecords
            };

            fs.writeFileSync("details.json", JSON.stringify(output, null, 2) + "\n", "utf8");
            console.log("details.json rebuilt from Tencent Docs.");
          }

          await client.close();
          EOF

          node sync.mjs

      - name: Commit details.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add details.json

          if git diff --cached --quiet; then
            echo "No details changes. Nothing to commit."
            exit 0
          fi

          git commit -m "Sync Tencent Docs details"
          git pull --rebase origin main
          git push origin HEAD:main
